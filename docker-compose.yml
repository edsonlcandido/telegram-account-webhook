# =============================================================================
# Docker Compose - Desenvolvimento Local
# Para produção, use os dois Dockerfiles separados no Easypanel
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Serviço 1: PocketBase + Frontend (Dockerfile.Application)
  # Sobe em: http://localhost:8090
  # ---------------------------------------------------------------------------
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.Application
    container_name: telegram-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - telegram-net

  # ---------------------------------------------------------------------------
  # Serviço 2: FastAPI + Telethon (Dockerfile.Telegram)
  # Sobe em: http://localhost:8000
  # Usa URL interna do PocketBase
  # ---------------------------------------------------------------------------
  telegram-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.Telegram
    container_name: telegram-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090  # URL interna (mesma rede Docker)
      - TG_API_ID=${TG_API_ID:-0}
      - TG_API_HASH=${TG_API_HASH:-}
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - telegram-net

networks:
  telegram-net:
    driver: bridge

volumes:
  pb_data:
